[project]
name = "habitattrack-api"
version = "0.1.0"
description = "Habitat Track API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "fastapi-cli>=0.0.2",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "google-cloud-firestore>=2.14.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C4", # flake8-comprehensions
]
ignore = [
    "B008",  # Function call in defaults - common FastAPI pattern
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
